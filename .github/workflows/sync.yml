on:
  workflow_call:
    secrets:
      GH_APP_KEY:
      BOT_TOKEN:

jobs:
  update:
    name: Update submodules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sync registry
        uses: r-universe-org/sync@master
        with:
          monorepo_url: https://github.com/${{ github.repository }}
        env:
          GH_APP_ID: '87942'
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
          GITHUB_PAT: ${{ secrets.BOT_TOKEN }}
